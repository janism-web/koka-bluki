<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF3B0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Spēļu kaste</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-maskable.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #FFF3B0;
      --bg-dot: #F4DC7A;
      --ink: #1E1B18;
      --surface: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 2.5px);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
    }

    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      opacity: 0.45;
      animation: floatShape 9s ease-in-out infinite;
    }

    .shape.circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FF9F87;
      border: 2.5px solid var(--ink);
      top: 14%;
      right: 8%;
    }

    .shape.triangle {
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-bottom: 24px solid #A7F3D0;
      bottom: 14%;
      left: 8%;
      animation-delay: -3s;
    }

    .shape.square {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: #C4B5FD;
      border: 2.5px solid var(--ink);
      bottom: 22%;
      right: 7%;
      transform: rotate(15deg);
      animation-delay: -5s;
    }

    @keyframes floatShape {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(12deg); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 16px) + 20px) 22px calc(env(safe-area-inset-bottom, 16px) + 24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hub-header {
      text-align: center;
      padding-top: 6px;
    }

    .hub-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-shadow: 3px 3px 0px rgba(255, 255, 255, 0.85);
    }

    .hub-sub {
      font-size: 16px;
      font-weight: 700;
      opacity: 0.78;
      margin-top: 4px;
    }

    .games-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: 12px 0;
    }

    .game-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 3.5px solid var(--ink);
      border-radius: 28px;
      box-shadow: 0 7px 0 var(--ink);
      padding: 18px;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .game-card:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .card-thumb {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      border-radius: 20px;
      border: 3px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .thumb-15 {
      background: #5BC0EB;
    }

    .thumb-15-tile {
      width: 52px;
      height: 52px;
      background: #FFD13B;
      border: 2.5px solid var(--ink);
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 3px 0 var(--ink);
    }

    .thumb-wood {
      background: radial-gradient(circle at 30% 30%, #c9884c, #7b4a26);
    }

    .wood-mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 22px);
      grid-template-rows: repeat(2, 22px);
      gap: 4px;
    }

    .wood-cell {
      border-radius: 6px;
      border: 2.5px solid var(--ink);
      background: #ffd859;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.5);
    }

    .wood-cell.empty {
      background: rgba(46, 22, 6, 0.45);
      border-color: rgba(30, 27, 24, 0.5);
      box-shadow: none;
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.15;
    }

    .card-desc {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.78;
      margin-top: 4px;
    }

    .card-best {
      display: inline-block;
      margin-top: 8px;
      background: #FFF3B0;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .play-arrow {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #34D399;
      border: 3px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hub-footer {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="shape circle"></div>
    <div class="shape triangle"></div>
    <div class="shape square"></div>
  </div>

  <main class="app">
    <header class="hub-header">
      <h1 class="hub-title">Spēļu kaste</h1>
      <p class="hub-sub">Izvēlies spēli brīvam brīdim</p>
    </header>

    <section class="games-list">
      <a href="./spele15.html" class="game-card">
        <div class="card-thumb thumb-15">
          <div class="thumb-15-tile">15</div>
        </div>
        <div class="card-info">
          <div class="card-title">Spēle 15</div>
          <div class="card-desc">Sakārto skaitļus secībā (3×3, 4×4, 5×5)</div>
        </div>
        <div class="play-arrow" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </a>

      <a href="./koka-bloki.html" class="game-card">
        <div class="card-thumb thumb-wood">
          <div class="wood-mini-grid">
            <div class="wood-cell"></div>
            <div class="wood-cell"></div>
            <div class="wood-cell"></div>
            <div class="wood-cell empty"></div>
          </div>
        </div>
        <div class="card-info">
          <div class="card-title">Koka Bloki</div>
          <div class="card-desc">Saliec figūras un attīri rindas un kvadrātus</div>
          <div class="card-best" id="koka-best-badge" style="display:none;"></div>
        </div>
        <div class="play-arrow" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </a>
    </section>

    <footer class="hub-footer">
      Strādā arī bez interneta (Offline)
    </footer>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    try {
      const best = localStorage.getItem('woodblock_best_v1') || localStorage.getItem('koka_bloki_best');
      if (best && Number(best) > 0) {
        const badge = document.getElementById('koka-best-badge');
        badge.textContent = `★ Rekords: ${best}`;
        badge.style.display = 'inline-block';
      }
    } catch (e) {}
  </script>
</body>
</html>
