<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a2012">
  <title>Wood Block Puzzle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
      touch-action: none;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse at 50% 25%, #653b1e 0%, #3a2012 65%, #1f0f07 100%);
      color: #fff;
    }

    /* Wooden cabinet framing */
    .wood-board-case {
      background: linear-gradient(155deg, #7c4c26 0%, #512f17 55%, #381e0e 100%);
      box-shadow: 
        0 18px 36px rgba(0,0,0,0.65), 
        inset 0 3px 5px rgba(255,255,255,0.22),
        inset 0 -4px 8px rgba(0,0,0,0.7);
      border: 3.5px solid #8f5a31;
    }

    .grid-recessed {
      background-color: #26150b;
      box-shadow: 
        inset 0 6px 14px rgba(0,0,0,0.85),
        inset 0 0 4px rgba(0,0,0,0.9);
      border: 2px solid #3c1e0e;
    }

    /* Cell slots on the board */
    .wood-cell-empty {
      background: linear-gradient(145deg, #2b170c, #1f0f07);
      border: 1px solid #3d2314;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.55);
      border-radius: 6px;
    }

    /* 3D Beveled Wooden Blocks */
    .wood-block {
      background: linear-gradient(140deg, #fce09b 0%, #e5b05c 40%, #c4832f 100%);
      box-shadow: 
        inset 0 2.5px 3px rgba(255,255,255,0.7), 
        inset 0 -2.5px 4px rgba(0,0,0,0.45),
        0 3px 5px rgba(0,0,0,0.4);
      border: 1.5px solid #ffeaab;
      border-radius: 7px;
      position: relative;
    }

    .wood-block::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    /* Highlight hover state */
    .wood-cell-hover {
      background: linear-gradient(135deg, #ffd375 0%, #e2a048 100%) !important;
      box-shadow: 0 0 14px #ffc857, inset 0 0 5px #fff !important;
      opacity: 0.82;
      border: 1.5px solid #ffe9b3 !important;
      transform: scale(0.96);
    }

    /* Clear Animation */
    @keyframes blockVanish {
      0% { transform: scale(1); filter: brightness(1); }
      40% { transform: scale(1.22); filter: brightness(1.85); box-shadow: 0 0 18px #ffeaa7; }
      100% { transform: scale(0); opacity: 0; }
    }

    .vanish {
      animation: blockVanish 0.26s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
      z-index: 10;
    }

    /* Top Badges exactly matching image */
    .score-badge-purple {
      background: linear-gradient(180deg, #7a42c4 0%, #50218e 100%);
      box-shadow: 
        0 6px 12px rgba(0,0,0,0.4), 
        inset 0 2px 3px rgba(255,255,255,0.4),
        inset 0 -2px 3px rgba(0,0,0,0.5);
      border: 2px solid #9962e8;
    }

    .combo-badge-brown {
      background: linear-gradient(180deg, #442a17 0%, #27140a 100%);
      box-shadow: 
        0 6px 12px rgba(0,0,0,0.4), 
        inset 0 2px 3px rgba(255,255,255,0.18),
        inset 0 -2px 3px rgba(0,0,0,0.6);
      border: 2px solid #b57a38;
      position: relative;
    }

    .combo-glow {
      border-color: #ffd166 !important;
      box-shadow: 
        0 0 18px rgba(255, 209, 102, 0.7), 
        inset 0 2px 4px rgba(255,255,255,0.4) !important;
    }

    /* Action button */
    .btn-wood {
      background: linear-gradient(180deg, #f5a623 0%, #d47511 100%);
      box-shadow: 0 5px 0 #8c4204, 0 8px 12px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
    }
    .btn-wood:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #8c4204, 0 4px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body class="flex flex-col items-center justify-between p-2 sm:p-4 max-w-md mx-auto select-none">

  <!-- Top Utilities Header -->
  <header class="w-full flex items-center justify-between px-2 pt-1 pb-1">
    <div class="flex items-center gap-1.5 text-xs text-amber-200/80 font-bold uppercase tracking-wider">
      <span>Labākais:</span>
      <span id="best-score" class="text-sm font-extrabold text-amber-300">0</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="sound-btn" class="w-8 h-8 rounded-full bg-amber-950/70 border border-amber-600/50 text-amber-200 flex items-center justify-center text-sm shadow active:scale-95">
        🔊
      </button>
      <button id="restart-top-btn" class="w-8 h-8 rounded-full bg-amber-950/70 border border-amber-600/50 text-amber-200 flex items-center justify-center text-sm shadow active:scale-95">
        🔄
      </button>
    </div>
  </header>

  <!-- Screenshot-Matching Header Badges -->
  <div class="w-full flex items-center justify-center gap-4 my-1">
    <!-- Purple Score Badge -->
    <div class="score-badge-purple min-w-[130px] px-5 py-1.5 rounded-2xl flex flex-col items-center">
      <div class="flex items-center gap-1 text-[11px] font-bold text-amber-200/90 tracking-wide">
        <svg class="w-3.5 h-3.5 fill-amber-300" viewBox="0 0 24 24">
          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5m14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
        </svg>
        <span>PUNKTI</span>
      </div>
      <div id="score" class="text-2xl font-black text-white tracking-wide">0</div>
    </div>

    <!-- Brown Combo Badge -->
    <div id="combo-badge" class="combo-badge-brown min-w-[130px] px-5 py-1.5 rounded-2xl flex flex-col items-center transition-all duration-200">
      <div class="text-[11px] font-bold text-amber-400 tracking-wider">Combo</div>
      <div id="combo" class="text-2xl font-black text-amber-300">0</div>
    </div>
  </div>

  <!-- Center Board Area -->
  <div class="relative w-full aspect-square max-w-[370px] flex items-center justify-center my-auto p-1">
    <div class="wood-board-case w-full h-full p-2.5 rounded-3xl flex items-center justify-center">
      <div id="board" class="grid-recessed w-full h-full rounded-2xl p-1.5 grid grid-cols-8 grid-rows-8 gap-1 relative overflow-hidden">
        <!-- 64 Board cells injected via JS -->
      </div>
    </div>

    <!-- Floating Combo Splash -->
    <div id="combo-splash" class="absolute pointer-events-none opacity-0 scale-50 transition-all duration-300 font-black text-4xl text-amber-300 drop-shadow-[0_4px_12px_rgba(0,0,0,0.9)] z-30">
      COMBO x2!
    </div>

    <!-- Particle Canvas for Clears -->
    <canvas id="particle-canvas" class="absolute inset-0 pointer-events-none z-20 w-full h-full"></canvas>
  </div>

  <!-- Bottom 3-Piece Dock -->
  <div class="w-full max-w-[370px] flex justify-between items-center gap-2 pb-2 pt-1 px-1">
    <div class="dock-slot w-1/3 h-24 bg-amber-950/45 border border-amber-900/50 rounded-2xl flex items-center justify-center relative touch-none" data-slot="0"></div>
    <div class="dock-slot w-1/3 h-24 bg-amber-950/45 border border-amber-900/50 rounded-2xl flex items-center justify-center relative touch-none" data-slot="1"></div>
    <div class="dock-slot w-1/3 h-24 bg-amber-950/45 border border-amber-900/50 rounded-2xl flex items-center justify-center relative touch-none" data-slot="2"></div>
  </div>

  <!-- Dragging Ghost -->
  <div id="ghost-drag" class="fixed pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 hidden will-change-transform"></div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-5 hidden">
    <div class="wood-board-case w-full max-w-xs p-6 rounded-3xl text-center flex flex-col items-center">
      <div class="text-4xl mb-2">🪵</div>
      <h2 class="text-2xl font-black text-amber-200 tracking-wider">NAV VIETAS!</h2>
      <p class="text-xs text-amber-100/70 mb-5">Neviens no blokiem vairs neietilpst laukumā.</p>

      <div class="w-full bg-amber-950/80 p-3.5 rounded-2xl mb-5 border border-amber-800/50">
        <div class="text-xs text-amber-400 font-bold mb-0.5">REZULTĀTS</div>
        <div id="final-score" class="text-3xl font-extrabold text-white">0</div>
        <div class="text-xs text-amber-300/80 mt-2">Visu laiku labākais: <span id="final-best">0</span></div>
      </div>

      <button id="modal-restart" class="btn-wood w-full py-3.5 rounded-2xl font-black text-lg text-amber-950 tracking-wider">
        SPĒLĒT VĒLREIZ
      </button>
    </div>
  </div>

  <script>
    /* Audio Synthesis (Zero external audio assets) */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }
      vibrate(ms) {
        if (navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }
      playPickup() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.04);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
        this.vibrate(10);
      }
      playPlace() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.09);
        gain.gain.setValueAtTime(0.45, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.1);
        this.vibrate(22);
      }
      playClear(comboLevel = 1) {
        if (!this.enabled) return;
        this.init();
        const notes = [0, 4, 7, 12, 16];
        const pitch = Math.min(1 + comboLevel * 0.15, 2.2);
        notes.forEach((semitone, i) => {
          const t = this.ctx.currentTime + i * 0.045;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const freq = 440 * Math.pow(2, semitone / 12) * pitch;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        });
        this.vibrate([30, 40, 50]);
      }
      playOver() {
        if (!this.enabled) return;
        this.init();
        const t = this.ctx.currentTime;
        [280, 220, 170, 120].forEach((freq, idx) => {
          const nt = t + idx * 0.1;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, nt);
          gain.gain.setValueAtTime(0.2, nt);
          gain.gain.exponentialRampToValueAtTime(0.001, nt + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(nt);
          osc.stop(nt + 0.13);
        });
        this.vibrate(200);
      }
    }

    const sound = new SoundEngine();

    /* Polyomino Shapes catalog */
    const SHAPES = [
      // 1x1
      { m: [[1]] },
      // 2x2 & 3x3
      { m: [[1,1],[1,1]] },
      { m: [[1,1,1],[1,1,1],[1,1,1]] },
      // Horizontals
      { m: [[1,1]] },
      { m: [[1,1,1]] },
      { m: [[1,1,1,1]] },
      { m: [[1,1,1,1,1]] },
      // Verticals
      { m: [[1],[1]] },
      { m: [[1],[1],[1]] },
      { m: [[1],[1],[1],[1]] },
      { m: [[1],[1],[1],[1],[1]] },
      // Corners
      { m: [[1,1],[1,0]] },
      { m: [[1,1],[0,1]] },
      { m: [[1,0],[1,1]] },
      { m: [[0,1],[1,1]] },
      // L shapes
      { m: [[1,0],[1,0],[1,1]] },
      { m: [[0,1],[0,1],[1,1]] },
      { m: [[1,1,1],[1,0,0]] },
      { m: [[1,1,1],[0,0,1]] },
      // T shapes
      { m: [[1,1,1],[0,1,0]] },
      { m: [[0,1,0],[1,1,1]] },
      { m: [[1,0],[1,1],[1,0]] },
      { m: [[0,1],[1,1],[0,1]] }
    ];

    /* Particle System */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeParticleCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeParticleCanvas);

    function spawnParticles(x, y) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 4 + 2,
          color: Math.random() > 0.4 ? '#fce09b' : '#e5b05c',
          life: 1
        });
      }
    }

    function updateParticles() {
      if (particles.length > 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.12; // gravity
          p.life -= 0.04;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      requestAnimationFrame(updateParticles);
    }
    requestAnimationFrame(updateParticles);

    /* Game State & Elements */
    const GRID_SIZE = 8;
    let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
    let dockSlots = [null, null, null];
    let score = 0;
    let combo = 0;
    let bestScore = parseInt(localStorage.getItem('wood_block_best') || '0', 10);

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('best-score');
    const comboEl = document.getElementById('combo');
    const comboBadgeEl = document.getElementById('combo-badge');
    const comboSplashEl = document.getElementById('combo-splash');
    const ghostDragEl = document.getElementById('ghost-drag');
    const soundBtn = document.getElementById('sound-btn');
    const restartTopBtn = document.getElementById('restart-top-btn');
    const gameoverModal = document.getElementById('gameover-modal');
    const finalScoreEl = document.getElementById('final-score');
    const finalBestEl = document.getElementById('final-best');
    const modalRestartBtn = document.getElementById('modal-restart');
    const dockSlotEls = [
      document.querySelector('[data-slot="0"]'),
      document.querySelector('[data-slot="1"]'),
      document.querySelector('[data-slot="2"]')
    ];

    bestScoreEl.textContent = bestScore;

    /* Build board DOM */
    function initBoardDOM() {
      boardEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'w-full h-full wood-cell-empty';
          cell.dataset.r = r;
          cell.dataset.c = c;
          boardEl.appendChild(cell);
        }
      }
      resizeParticleCanvas();
    }

    function renderBoard() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const index = r * GRID_SIZE + c;
          const cell = boardEl.children[index];
          if (grid[r][c] === 1) {
            cell.className = 'w-full h-full wood-block';
          } else {
            cell.className = 'w-full h-full wood-cell-empty';
          }
        }
      }
    }

    /* Shape Generation */
    function spawnDockPieces() {
      for (let i = 0; i < 3; i++) {
        const rand = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        dockSlots[i] = JSON.parse(JSON.stringify(rand));
      }
      renderDock();
      checkGameOver();
    }

    function renderDock() {
      dockSlots.forEach((shape, slotIdx) => {
        const slotEl = dockSlotEls[slotIdx];
        slotEl.innerHTML = '';
        if (!shape) return;

        const rows = shape.m.length;
        const cols = shape.m[0].length;
        const maxDim = Math.max(rows, cols);
        const miniSize = maxDim > 3 ? 15 : (maxDim > 2 ? 19 : 24);

        const container = document.createElement('div');
        container.className = 'grid gap-1 pointer-events-auto cursor-grab active:cursor-grabbing';
        container.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
        container.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const tile = document.createElement('div');
            tile.style.width = `${miniSize}px`;
            tile.style.height = `${miniSize}px`;
            if (shape.m[r][c]) {
              tile.className = 'wood-block shadow-sm';
            } else {
              tile.style.opacity = '0';
            }
            container.appendChild(tile);
          }
        }

        bindDragEvents(container, slotIdx);
        slotEl.appendChild(container);
      });
    }

    /* Grid Fit Verification */
    function canFit(matrix, startR, startC) {
      const rows = matrix.length;
      const cols = matrix[0].length;

      if (startR < 0 || startC < 0 || startR + rows > GRID_SIZE || startC + cols > GRID_SIZE) {
        return false;
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (matrix[r][c] && grid[startR + r][startC + c] === 1) {
            return false;
          }
        }
      }
      return true;
    }

    function canPieceFitAnywhere(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      for (let r = 0; r <= GRID_SIZE - rows; r++) {
        for (let c = 0; c <= GRID_SIZE - cols; c++) {
          if (canFit(matrix, r, c)) return true;
        }
      }
      return false;
    }

    /* Highlight Hover */
    function clearHighlights() {
      document.querySelectorAll('.wood-cell-hover').forEach(el => el.classList.remove('wood-cell-hover'));
    }

    function applyHighlight(matrix, startR, startC) {
      clearHighlights();
      if (!canFit(matrix, startR, startC)) return;

      const rows = matrix.length;
      const cols = matrix[0].length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (matrix[r][c]) {
            const idx = (startR + r) * GRID_SIZE + (startC + c);
            const cell = boardEl.children[idx];
            if (cell) cell.classList.add('wood-cell-hover');
          }
        }
      }
    }

    /* Mobile Finger Offset Drag-and-Drop */
    let dragCtx = null;

    function bindDragEvents(el, slotIdx) {
      const onStart = (clientX, clientY) => {
        sound.init();
        sound.playPickup();

        const shape = dockSlots[slotIdx];
        if (!shape) return;

        const boardRect = boardEl.getBoundingClientRect();
        const cellSize = boardRect.width / GRID_SIZE;
        const rows = shape.m.length;
        const cols = shape.m[0].length;

        // Render full-scale ghost block
        ghostDragEl.innerHTML = '';
        ghostDragEl.className = 'fixed pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 grid gap-1 drop-shadow-2xl';
        ghostDragEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize - 4}px)`;
        ghostDragEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize - 4}px)`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const b = document.createElement('div');
            b.style.width = `${cellSize - 4}px`;
            b.style.height = `${cellSize - 4}px`;
            if (shape.m[r][c]) {
              b.className = 'wood-block';
            } else {
              b.style.opacity = '0';
            }
            ghostDragEl.appendChild(b);
          }
        }

        // Thumb offset: elevates block ~70px higher on touch so the player sees where it lands
        const fingerOffset = 72;

        dragCtx = {
          slotIdx,
          shape,
          fingerOffset,
          rows,
          cols,
          cellSize,
          targetCell: null
        };

        ghostDragEl.style.left = `${clientX}px`;
        ghostDragEl.style.top = `${clientY - fingerOffset}px`;
        ghostDragEl.classList.remove('hidden');

        el.style.opacity = '0.2';
      };

      const onMove = (clientX, clientY) => {
        if (!dragCtx) return;

        const posX = clientX;
        const posY = clientY - dragCtx.fingerOffset;

        ghostDragEl.style.left = `${posX}px`;
        ghostDragEl.style.top = `${posY}px`;

        const boardRect = boardEl.getBoundingClientRect();
        const pieceW = dragCtx.cols * dragCtx.cellSize;
        const pieceH = dragCtx.rows * dragCtx.cellSize;

        const pieceLeft = posX - pieceW / 2;
        const pieceTop = posY - pieceH / 2;

        const targetCol = Math.round((pieceLeft - boardRect.left) / dragCtx.cellSize);
        const targetRow = Math.round((pieceTop - boardRect.top) / dragCtx.cellSize);

        if (canFit(dragCtx.shape.m, targetRow, targetCol)) {
          applyHighlight(dragCtx.shape.m, targetRow, targetCol);
          dragCtx.targetCell = { r: targetRow, c: targetCol };
        } else {
          clearHighlights();
          dragCtx.targetCell = null;
        }
      };

      const onEnd = () => {
        if (!dragCtx) return;

        clearHighlights();
        ghostDragEl.classList.add('hidden');
        el.style.opacity = '1';

        if (dragCtx.targetCell) {
          placeShape(dragCtx.shape, dragCtx.targetCell.r, dragCtx.targetCell.c, dragCtx.slotIdx);
        }

        dragCtx = null;
      };

      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        onStart(e.clientX, e.clientY);

        const moveHandler = (ev) => onMove(ev.clientX, ev.clientY);
        const endHandler = () => {
          onEnd();
          window.removeEventListener('pointermove', moveHandler);
          window.removeEventListener('pointerup', endHandler);
          window.removeEventListener('pointercancel', endHandler);
        };

        window.addEventListener('pointermove', moveHandler, { passive: false });
        window.addEventListener('pointerup', endHandler);
        window.addEventListener('pointercancel', endHandler);
      });
    }

    /* Placement & Line Elimination */
    function placeShape(shape, startR, startC, slotIdx) {
      const rows = shape.m.length;
      const cols = shape.m[0].length;
      let tilesPlaced = 0;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (shape.m[r][c]) {
            grid[startR + r][startC + c] = 1;
            tilesPlaced++;
          }
        }
      }

      addScore(tilesPlaced);
      sound.playPlace();

      dockSlots[slotIdx] = null;
      dockSlotEls[slotIdx].innerHTML = '';

      renderBoard();
      evaluateLines();

      if (dockSlots.every(s => s === null)) {
        setTimeout(spawnDockPieces, 140);
      } else {
        checkGameOver();
      }
    }

    function evaluateLines() {
      const fullRows = [];
      const fullCols = [];

      for (let r = 0; r < GRID_SIZE; r++) {
        if (grid[r].every(v => v === 1)) fullRows.push(r);
      }

      for (let c = 0; c < GRID_SIZE; c++) {
        let full = true;
        for (let r = 0; r < GRID_SIZE; r++) {
          if (grid[r][c] !== 1) { full = false; break; }
        }
        if (full) fullCols.push(c);
      }

      const totalLines = fullRows.length + fullCols.length;

      if (totalLines > 0) {
        combo++;
        updateComboUI(combo);
        sound.playClear(combo);

        const cellsToClear = new Set();
        fullRows.forEach(r => {
          for (let c = 0; c < GRID_SIZE; c++) cellsToClear.add(`${r},${c}`);
        });
        fullCols.forEach(c => {
          for (let r = 0; r < GRID_SIZE; r++) cellsToClear.add(`${r},${c}`);
        });

        // Trigger particles & dissolve animation
        const boardRect = boardEl.getBoundingClientRect();
        const cellSize = boardRect.width / GRID_SIZE;

        cellsToClear.forEach(coord => {
          const [r, c] = coord.split(',').map(Number);
          const cell = boardEl.children[r * GRID_SIZE + c];
          cell.classList.add('vanish');

          // Centroid particle burst
          const px = c * cellSize + cellSize / 2;
          const py = r * cellSize + cellSize / 2;
          spawnParticles(px, py);
        });

        // Score award
        const earned = totalLines * 100 * combo;
        addScore(earned);

        if (combo > 1) {
          showComboSplash(`COMBO x${combo}!`);
        }

        setTimeout(() => {
          fullRows.forEach(r => {
            for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = 0;
          });
          fullCols.forEach(c => {
            for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = 0;
          });
          renderBoard();
          checkGameOver();
        }, 260);
      } else {
        combo = 0;
        updateComboUI(0);
      }
    }

    function addScore(pts) {
      score += pts;
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('wood_block_best', bestScore);
      }
    }

    function updateComboUI(count) {
      comboEl.textContent = count;
      if (count > 0) {
        comboBadgeEl.classList.add('combo-glow');
      } else {
        comboBadgeEl.classList.remove('combo-glow');
      }
    }

    function showComboSplash(txt) {
      comboSplashEl.textContent = txt;
      comboSplashEl.classList.remove('opacity-0', 'scale-50');
      comboSplashEl.classList.add('opacity-100', 'scale-110');
      setTimeout(() => {
        comboSplashEl.classList.remove('opacity-100', 'scale-110');
        comboSplashEl.classList.add('opacity-0', 'scale-50');
      }, 700);
    }

    function checkGameOver() {
      const available = dockSlots.filter(s => s !== null);
      if (available.length === 0) return;

      const canMove = available.some(shape => canPieceFitAnywhere(shape.m));
      if (!canMove) {
        sound.playOver();
        finalScoreEl.textContent = score;
        finalBestEl.textContent = bestScore;
        gameoverModal.classList.remove('hidden');
      }
    }

    function restartGame() {
      grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
      score = 0;
      combo = 0;
      scoreEl.textContent = '0';
      updateComboUI(0);
      gameoverModal.classList.add('hidden');
      initBoardDOM();
      renderBoard();
      spawnDockPieces();
    }

    soundBtn.addEventListener('click', () => {
      const active = sound.toggle();
      soundBtn.textContent = active ? '🔊' : '🔇';
    });

    restartTopBtn.addEventListener('click', restartGame);
    modalRestartBtn.addEventListener('click', restartGame);

    window.onload = () => {
      initBoardDOM();
      renderBoard();
      spawnDockPieces();
    };
  </script>
</body>
</html>
