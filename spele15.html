<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFF3B0" id="meta-theme" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Spēļu kaste" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Spēle 15 — Spēļu kaste</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preload" href="./fonts/nunito-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./shared.css" />
  <link rel="stylesheet" href="./spele15.css" />
  <script src="./shared.js"></script>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="shape circle"></div>
    <div class="shape triangle"></div>
    <div class="shape square"></div>
  </div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <div class="sr-only" id="sr-status" aria-live="polite"></div>

  <main class="app">
    <header>
      <div class="top-bar">
        <div class="title-group">
          <a href="./index.html" class="back-hub-btn" aria-label="Atpakaļ uz Spēļu kasti" title="Spēļu kaste">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </a>
          <h1 class="title">Spēle 15</h1>
        </div>
        <div class="best-chip" id="best-chip" style="display:none;">
          <span>★</span>
          <span id="best-chip-val">—</span>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill" role="group" aria-label="Gājienu skaits">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
          </svg>
          <span id="moves-val">0</span>
        </div>

        <div class="stat-pill" aria-label="Spēles laiks">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2 2"/>
            <path d="M9 2h6"/>
          </svg>
          <span id="timer-val">00:00</span>
        </div>

        <button class="pause-btn" id="pause-btn" type="button" aria-label="Pauze">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1.5"/>
            <rect x="14" y="4" width="4" height="16" rx="1.5"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="board-stage">
      <div class="board-frame" id="board-frame">
        <div class="board-inner" id="board-inner">
          <div class="grid-slots" id="grid-slots"></div>
          <div class="tiles-layer" id="tiles-layer"></div>

          <div class="pause-veil" id="pause-veil" aria-hidden="true">
            <div class="pause-veil-title">Pauze</div>
            <button class="shuffle-btn" id="resume-btn" type="button" style="width: auto; padding: 0 28px;">
              Turpināt spēli
            </button>
            <a href="./index.html" class="hub-link-btn">Spēļu kaste</a>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottom-controls">
      <div class="size-row" role="group" aria-label="Laukuma izmērs">
        <button class="size-btn" data-size="3" type="button">3×3</button>
        <button class="size-btn active" data-size="4" type="button">★ 4×4</button>
        <button class="size-btn" data-size="5" type="button">5×5</button>
      </div>

      <button class="shuffle-btn" id="shuffle-btn" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
          <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
          <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/>
          <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/>
        </svg>
        <span>Sajaukt!</span>
      </button>
    </footer>
  </main>

  <div class="snackbar" id="snackbar">
    <span>Laukums sajaukts</span>
    <button class="undo-btn" id="undo-btn" type="button">Atsaukt</button>
  </div>

  <div class="modal-backdrop" id="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-sheet">
      <div class="win-badge" id="win-badge">★ Lieliski paveikts!</div>
      <h2 class="win-title" id="win-title">Uzvara!</h2>
      <div class="win-stats">
        <div class="win-stat-box">
          <div class="win-stat-label">Gājieni</div>
          <div class="win-stat-val" id="win-moves">0</div>
        </div>
        <div class="win-stat-box">
          <div class="win-stat-label">Laiks</div>
          <div class="win-stat-val" id="win-time">00:00</div>
        </div>
      </div>
      <div class="win-actions">
        <a href="./index.html" class="win-hub-btn">Spēļu kaste</a>
        <button class="shuffle-btn" id="play-again-btn" type="button">Spēlēt vēlreiz</button>
      </div>
    </div>
  </div>
  <script src="./spele15.js"></script>
</body>
</html>
