<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF3B0" id="meta-theme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Spēle 15 — Spēļu kaste</title>
  <link rel="manifest" href="./manifest.json?v=6" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-maskable.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #FFF3B0;
      --bg-dot: #F4DC7A;
      --ink: #1E1B18;
      --surface: #FFFFFF;
      --surface-soft: #FFF8D6;
      --board-bg: #5BC0EB;
      --board-well: #3A9BC7;
      --tile-default: #70C1FF;
      --tile-default-hi: #A3D9FF;
      --tile-alt: #4ADE80;
      --tile-alt-hi: #86EFAC;
      --tile-correct: #FFD13B;
      --tile-correct-hi: #FFE585;
      --btn-primary: #34D399;
      --btn-active: #FFD13B;
      --border-w: 3px;
      --title-shadow: rgba(255, 255, 255, 0.8);
    }

    body.dark-mode {
      --bg-base: #1C1E26;
      --bg-dot: #2A2E3B;
      --ink: #121318;
      --surface: #2B2F3C;
      --surface-soft: #232631;
      --board-bg: #367FA6;
      --board-well: #235875;
      --title-shadow: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode .title,
    body.dark-mode .stat-pill,
    body.dark-mode .pause-btn,
    body.dark-mode .size-btn,
    body.dark-mode .win-sheet {
      color: #F8FAFC;
    }

    body.dark-mode .size-btn.active {
      color: #1E1B18;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html {
      background-color: #FFF3B0;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 2.5px);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
    }

    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      opacity: 0.42;
      animation: floatShape 9s ease-in-out infinite;
    }

    .shape.circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FF9F87;
      border: 2.5px solid var(--ink);
      top: 24%;
      right: 7%;
    }

    .shape.triangle {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 22px solid #A7F3D0;
      bottom: 24%;
      left: 7%;
      animation-delay: -3s;
    }

    .shape.square {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: #C4B5FD;
      border: 2.5px solid var(--ink);
      top: 63%;
      right: 6%;
      transform: rotate(15deg);
      animation-delay: -5s;
    }

    @keyframes floatShape {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(12deg); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 10px) + 12px) 22px calc(env(safe-area-inset-bottom, 12px) + 14px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-shadow: 2px 2px 0px var(--title-shadow);
    }

    .best-chip {
      background: var(--surface);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    body.dark-mode .best-chip {
      color: #FFD13B;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .stat-pill {
      flex: 1;
      height: 46px;
      background: var(--surface);
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 4px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding: 0 12px;
    }

    .pause-btn {
      width: 48px;
      height: 46px;
      flex-shrink: 0;
      background: var(--surface);
      border: var(--border-w) solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .pause-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .board-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      min-height: 0;
    }

    .board-frame {
      position: relative;
      width: min(100%, 348px, 46dvh);
      aspect-ratio: 1 / 1;
      background: var(--board-bg);
      border: 4px solid var(--ink);
      border-radius: 30px;
      box-shadow: 0 8px 0 var(--ink);
      padding: 10px;
      touch-action: none;
    }

    .board-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--board-well);
      border: 3px solid var(--ink);
      border-radius: 20px;
      overflow: hidden;
    }

    .grid-slots {
      position: absolute;
      inset: 6px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .slot-hole {
      background: rgba(20, 50, 75, 0.25);
      border-radius: 14px;
    }

    .tiles-layer {
      position: absolute;
      inset: 6px;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      border: 3px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 5px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--ink);
      cursor: grab;
      will-change: transform;
      transition: transform 0.16s cubic-bezier(0.22, 1.25, 0.36, 1), background-color 0.2s ease;
      background: var(--tile-default);
    }

    .tile::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 8px;
      right: 8px;
      height: 26%;
      border-radius: 10px;
      background: var(--tile-default-hi);
      opacity: 0.7;
      pointer-events: none;
    }

    .tile.alt {
      background: var(--tile-alt);
    }

    .tile.alt::before {
      background: var(--tile-alt-hi);
    }

    .tile.correct {
      background: var(--tile-correct);
    }

    .tile.correct::before {
      background: var(--tile-correct-hi);
    }

    .tile-star {
      position: absolute;
      top: 5px;
      right: 7px;
      font-size: 11px;
      line-height: 1;
      color: var(--ink);
      opacity: 0;
      transform: scale(0.4) rotate(-30deg);
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .tile.correct .tile-star {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .tile-num {
      position: relative;
      z-index: 2;
      color: #FFFFFF;
      -webkit-text-stroke: 2px var(--ink);
      paint-order: stroke fill;
      text-shadow: 0 2px 0 var(--ink);
      pointer-events: none;
    }

    .tile.correct .tile-num {
      color: var(--ink);
      -webkit-text-stroke: 0;
      text-shadow: none;
    }

    .tile.dragging {
      transition: none;
      z-index: 20;
      cursor: grabbing;
    }

    .tile.win-pop {
      animation: winWave 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes winWave {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.18); }
      100% { filter: brightness(1); }
    }

    .pause-veil {
      position: absolute;
      inset: 0;
      background: #FFD13B;
      color: #1E1B18;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .pause-veil.active {
      opacity: 1;
      pointer-events: auto;
    }

    .pause-veil-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .hub-link-btn {
      background: #FFFFFF;
      color: #1E1B18;
      border: 3px solid #1E1B18;
      border-radius: 999px;
      box-shadow: 0 4px 0 #1E1B18;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bottom-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .size-btn {
      height: 48px;
      background: var(--surface);
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 4px 0 var(--ink);
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
    }

    .size-btn.active {
      background: var(--btn-active);
    }

    .size-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .shuffle-btn {
      width: 100%;
      height: 54px;
      background: var(--btn-primary);
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 5px 0 var(--ink);
      font-family: inherit;
      font-size: 19px;
      font-weight: 800;
      color: #1E1B18;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .shuffle-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .snackbar {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 132px);
      transform: translate(-50%, 20px);
      background: #1E1B18;
      color: #FFFFFF;
      padding: 10px 14px 10px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .snackbar.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .undo-btn {
      background: #FFD13B;
      color: #1E1B18;
      border: none;
      border-radius: 999px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 19, 24, 0.6);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .win-sheet {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border-top: 4px solid var(--ink);
      border-left: 4px solid var(--ink);
      border-right: 4px solid var(--ink);
      border-radius: 32px 32px 0 0;
      padding: 24px 24px calc(env(safe-area-inset-bottom, 16px) + 24px);
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
    }

    .modal-backdrop.open .win-sheet {
      transform: translateY(0);
    }

    .win-badge {
      display: inline-block;
      background: #FFD13B;
      color: #1E1B18;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .win-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .win-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .win-stat-box {
      background: var(--surface-soft);
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 12px;
    }

    .win-stat-label {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.75;
    }

    .win-stat-val {
      font-size: 24px;
      font-weight: 800;
      margin-top: 2px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }
  </style>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="shape circle"></div>
    <div class="shape triangle"></div>
    <div class="shape square"></div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <header>
      <div class="top-bar">
        <h1 class="title">Spēle 15</h1>
        <div class="best-chip" id="best-chip" style="display:none;">
          <span>★</span>
          <span id="best-chip-val">—</span>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill" aria-label="Gājienu skaits">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
          </svg>
          <span id="moves-val">0</span>
        </div>

        <div class="stat-pill" aria-label="Spēles laiks">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2 2"/>
            <path d="M9 2h6"/>
          </svg>
          <span id="timer-val">00:00</span>
        </div>

        <button class="pause-btn" id="pause-btn" type="button" aria-label="Pauze">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1.5"/>
            <rect x="14" y="4" width="4" height="16" rx="1.5"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="board-stage">
      <div class="board-frame" id="board-frame">
        <div class="board-inner" id="board-inner">
          <div class="grid-slots" id="grid-slots"></div>
          <div class="tiles-layer" id="tiles-layer"></div>

          <div class="pause-veil" id="pause-veil">
            <div class="pause-veil-title">Pauze</div>
            <button class="shuffle-btn" id="resume-btn" type="button" style="width: auto; padding: 0 28px;">
              Turpināt spēli
            </button>
            <a href="./index.html" class="hub-link-btn">Spēļu kaste</a>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottom-controls">
      <div class="size-row" role="group" aria-label="Laukuma izmērs">
        <button class="size-btn" data-size="3" type="button">3×3</button>
        <button class="size-btn active" data-size="4" type="button">★ 4×4</button>
        <button class="size-btn" data-size="5" type="button">5×5</button>
      </div>

      <button class="shuffle-btn" id="shuffle-btn" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
          <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
          <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/>
          <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/>
        </svg>
        <span>Sajaukt!</span>
      </button>
    </footer>
  </main>

  <div class="snackbar" id="snackbar">
    <span>Laukums sajaukts</span>
    <button class="undo-btn" id="undo-btn" type="button">Atsaukt</button>
  </div>

  <div class="modal-backdrop" id="win-modal">
    <div class="win-sheet">
      <div class="win-badge" id="win-badge">★ Lieliski paveikts!</div>
      <h2 class="win-title">Uzvara!</h2>
      <div class="win-stats">
        <div class="win-stat-box">
          <div class="win-stat-label">Gājieni</div>
          <div class="win-stat-val" id="win-moves">0</div>
        </div>
        <div class="win-stat-box">
          <div class="win-stat-label">Laiks</div>
          <div class="win-stat-val" id="win-time">00:00</div>
        </div>
      </div>
      <button class="shuffle-btn" id="play-again-btn" type="button">Spēlēt vēlreiz</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    (() => {
      const STATE_KEY = 'spele15_saved_state_v1';
      const savedTheme = localStorage.getItem('spelu_kaste_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.body.classList.add('dark-mode');
        document.getElementById('meta-theme').setAttribute('content', '#1C1E26');
      }

      const GAP = 8;
      let size = 4;
      let board = [];
      let tileElements = new Map();
      let moves = 0;
      let seconds = 0;
      let timerId = null;
      let isPaused = false;
      let isWon = false;
      let backupState = null;
      let snackbarTimeout = null;
      let cellStep = 0;
      let tileSize = 0;

      const movesEl = document.getElementById('moves-val');
      const timerEl = document.getElementById('timer-val');
      const bestChip = document.getElementById('best-chip');
      const bestChipVal = document.getElementById('best-chip-val');
      const gridSlotsEl = document.getElementById('grid-slots');
      const tilesLayerEl = document.getElementById('tiles-layer');
      const pauseBtn = document.getElementById('pause-btn');
      const pauseVeil = document.getElementById('pause-veil');
      const resumeBtn = document.getElementById('resume-btn');
      const shuffleBtn = document.getElementById('shuffle-btn');
      const sizeBtns = document.querySelectorAll('.size-btn');
      const snackbarEl = document.getElementById('snackbar');
      const undoBtn = document.getElementById('undo-btn');
      const winModal = document.getElementById('win-modal');
      const winBadge = document.getElementById('win-badge');
      const winMovesEl = document.getElementById('win-moves');
      const winTimeEl = document.getElementById('win-time');
      const playAgainBtn = document.getElementById('play-again-btn');

      function formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      function saveGameState() {
        try {
          if (isWon || moves === 0) {
            localStorage.removeItem(STATE_KEY);
            return;
          }
          localStorage.setItem(STATE_KEY, JSON.stringify({ size, board, moves, seconds }));
        } catch (e) {}
      }

      function loadGameState() {
        try {
          const raw = localStorage.getItem(STATE_KEY);
          if (!raw) return false;
          const st = JSON.parse(raw);
          if (!st || !Array.isArray(st.board) || st.board.length !== st.size * st.size) return false;
          size = st.size;
          board = st.board;
          moves = st.moves || 0;
          seconds = st.seconds || 0;
          isWon = false;
          isPaused = false;
          return true;
        } catch (e) {
          return false;
        }
      }

      function getBestRecord(n) {
        try {
          const raw = localStorage.getItem(`spele15_best_${n}`);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function saveBestRecord(n, m, s) {
        const prev = getBestRecord(n);
        let isNew = false;
        if (!prev || s < prev.seconds || (s === prev.seconds && m < prev.moves)) {
          isNew = true;
          try {
            localStorage.setItem(`spele15_best_${n}`, JSON.stringify({ moves: m, seconds: s }));
          } catch (e) {}
        }
        updateBestChip();
        return isNew;
      }

      function updateBestChip() {
        const best = getBestRecord(size);
        if (best) {
          bestChip.style.display = 'inline-flex';
          bestChipVal.textContent = `${formatTime(best.seconds)} · ${best.moves}`;
        } else {
          bestChip.style.display = 'none';
        }
      }

      function updateStatsUI() {
        movesEl.textContent = moves;
        timerEl.textContent = formatTime(seconds);
      }

      function startTimer() {
        if (timerId || isWon || isPaused) return;
        timerId = setInterval(() => {
          if (!isPaused && !isWon) {
            seconds++;
            timerEl.textContent = formatTime(seconds);
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function setPaused(paused) {
        if (isWon) return;
        isPaused = paused;
        pauseVeil.classList.toggle('active', isPaused);
        if (isPaused) {
          saveGameState();
          try { history.pushState({ overlay: 'pause' }, ''); } catch (e) {}
        }
      }

      function isSolvable(arr, n) {
        let inversions = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] === 0) continue;
          for (let j = i + 1; j < arr.length; j++) {
            if (arr[j] === 0) continue;
            if (arr[i] > arr[j]) inversions++;
          }
        }
        if (n % 2 === 1) {
          return inversions % 2 === 0;
        } else {
          const emptyIndex = arr.indexOf(0);
          const emptyRowFromBottom = n - Math.floor(emptyIndex / n);
          if (emptyRowFromBottom % 2 === 0) {
            return inversions % 2 === 1;
          } else {
            return inversions % 2 === 0;
          }
        }
      }

      function isSolved(arr) {
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] !== i + 1) return false;
        }
        return arr[arr.length - 1] === 0;
      }

      function generateSolvableBoard(n) {
        const total = n * n;
        const arr = Array.from({ length: total }, (_, i) => (i + 1) % total);
        do {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
        } while (!isSolvable(arr, n) || isSolved(arr));
        return arr;
      }

      // Measured only on build & resize to prevent layout thrashing during gameplay
      function computeMetrics() {
        const width = tilesLayerEl.clientWidth > 0 ? tilesLayerEl.clientWidth : 290;
        tileSize = (width - GAP * (size - 1)) / size;
        cellStep = tileSize + GAP;
      }

      function applyTileSizes() {
        const fontSize = Math.round(tileSize * (size === 5 ? 0.42 : 0.46));
        tileElements.forEach((tile) => {
          tile.style.width = `${tileSize}px`;
          tile.style.height = `${tileSize}px`;
          tile.style.fontSize = `${fontSize}px`;
        });
      }

      function buildBoardDOM() {
        gridSlotsEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        gridSlotsEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;
        gridSlotsEl.innerHTML = '';

        const total = size * size;
        for (let i = 0; i < total; i++) {
          const hole = document.createElement('div');
          hole.className = 'slot-hole';
          gridSlotsEl.appendChild(hole);
        }

        tilesLayerEl.innerHTML = '';
        tileElements.clear();
        computeMetrics();

        for (let val = 1; val < total; val++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          if (val % 3 === 0) tile.classList.add('alt');

          const star = document.createElement('span');
          star.className = 'tile-star';
          star.textContent = '★';

          const num = document.createElement('span');
          num.className = 'tile-num';
          num.textContent = val;

          tile.appendChild(star);
          tile.appendChild(num);
          tilesLayerEl.appendChild(tile);
          tileElements.set(val, tile);

          attachTilePointer(tile, val);
        }

        applyTileSizes();
        renderTiles();
      }

      function renderTiles() {
        for (let idx = 0; idx < board.length; idx++) {
          const val = board[idx];
          if (val === 0) continue;
          const tile = tileElements.get(val);
          if (!tile) continue;

          const row = Math.floor(idx / size);
          const col = idx % size;
          const x = col * cellStep;
          const y = row * cellStep;

          tile.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          tile.classList.toggle('correct', val === idx + 1);
        }
      }

      function getMovableGroup(tileVal) {
        const tileIdx = board.indexOf(tileVal);
        const emptyIdx = board.indexOf(0);
        const tRow = Math.floor(tileIdx / size);
        const tCol = tileIdx % size;
        const eRow = Math.floor(emptyIdx / size);
        const eCol = emptyIdx % size;

        if (tRow !== eRow && tCol !== eCol) return null;

        const indices = [];
        let dirX = 0;
        let dirY = 0;

        if (tRow === eRow) {
          dirX = eCol > tCol ? 1 : -1;
          for (let c = tCol; c !== eCol; c += dirX) {
            indices.push(tRow * size + c);
          }
        } else {
          dirY = eRow > tRow ? 1 : -1;
          for (let r = tRow; r !== eRow; r += dirY) {
            indices.push(r * size + tCol);
          }
        }

        return { indices, emptyIdx, dirX, dirY };
      }

      function executeMove(group) {
        const { indices, emptyIdx } = group;
        let targetIdx = emptyIdx;

        for (let i = indices.length - 1; i >= 0; i--) {
          const fromIdx = indices[i];
          board[targetIdx] = board[fromIdx];
          targetIdx = fromIdx;
        }
        board[targetIdx] = 0;

        moves++;
        if (moves === 1) startTimer();
        updateStatsUI();
        renderTiles();
        saveGameState();

        if (isSolved(board)) {
          handleWin();
        }
      }

      function attachTilePointer(tile, tileVal) {
        tile.addEventListener('pointerdown', (e) => {
          if (isPaused || isWon) return;
          const group = getMovableGroup(tileVal);
          if (!group) return;

          e.preventDefault();
          tile.setPointerCapture(e.pointerId);

          const startX = e.clientX;
          const startY = e.clientY;
          let currentOffset = 0;
          let moved = false;

          const groupTiles = group.indices.map((idx) => {
            const val = board[idx];
            const el = tileElements.get(val);
            const r = Math.floor(idx / size);
            const c = idx % size;
            el.classList.add('dragging');
            return { el, baseX: c * cellStep, baseY: r * cellStep };
          });

          const onPointerMove = (ev) => {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;

            let raw = group.dirX !== 0 ? dx * group.dirX : dy * group.dirY;
            currentOffset = Math.max(0, Math.min(cellStep, raw));

            groupTiles.forEach(({ el, baseX, baseY }) => {
              const nx = baseX + group.dirX * currentOffset;
              const ny = baseY + group.dirY * currentOffset;
              el.style.transform = `translate3d(${nx}px, ${ny}px, 0)`;
            });
          };

          const onPointerUp = () => {
            tile.removeEventListener('pointermove', onPointerMove);
            tile.removeEventListener('pointerup', onPointerUp);
            tile.removeEventListener('pointercancel', onPointerUp);

            groupTiles.forEach(({ el }) => el.classList.remove('dragging'));

            if (!moved || currentOffset > cellStep * 0.3) {
              executeMove(group);
            } else {
              renderTiles();
            }
          };

          tile.addEventListener('pointermove', onPointerMove);
          tile.addEventListener('pointerup', onPointerUp);
          tile.addEventListener('pointercancel', onPointerUp);
        });
      }

      function handleWin() {
        isWon = true;
        stopTimer();
        localStorage.removeItem(STATE_KEY);
        const isNewBest = saveBestRecord(size, moves, seconds);

        for (let val = 1; val < size * size; val++) {
          const el = tileElements.get(val);
          if (el) {
            setTimeout(() => el.classList.add('win-pop'), val * 30);
          }
        }

        launchConfetti();

        setTimeout(() => {
          winBadge.textContent = isNewBest ? `★ Jauns ${size}×${size} rekords!` : '★ Lieliski paveikts!';
          winMovesEl.textContent = moves;
          winTimeEl.textContent = formatTime(seconds);
          winModal.classList.add('open');
          try { history.pushState({ overlay: 'win' }, ''); } catch (e) {}
        }, 750);
      }

      function showUndoSnackbar() {
        snackbarEl.classList.add('show');
        clearTimeout(snackbarTimeout);
        snackbarTimeout = setTimeout(() => {
          snackbarEl.classList.remove('show');
        }, 4200);
      }

      function syncSizeButtons() {
        sizeBtns.forEach((btn) => {
          const bSize = Number(btn.dataset.size);
          const active = bSize === size;
          btn.classList.toggle('active', active);
          btn.textContent = active ? `★ ${bSize}×${bSize}` : `${bSize}×${bSize}`;
        });
      }

      function startNewGame(newSize = size, allowUndo = false) {
        if (allowUndo && moves > 5 && !isWon) {
          backupState = {
            size,
            board: [...board],
            moves,
            seconds
          };
          showUndoSnackbar();
        } else {
          snackbarEl.classList.remove('show');
        }

        stopTimer();
        size = newSize;
        board = generateSolvableBoard(size);
        moves = 0;
        seconds = 0;
        isWon = false;
        isPaused = false;
        pauseVeil.classList.remove('active');
        winModal.classList.remove('open');
        localStorage.removeItem(STATE_KEY);

        syncSizeButtons();
        updateBestChip();
        updateStatsUI();
        buildBoardDOM();
      }

      undoBtn.addEventListener('click', () => {
        if (!backupState) return;
        stopTimer();
        size = backupState.size;
        board = [...backupState.board];
        moves = backupState.moves;
        seconds = backupState.seconds;
        isWon = false;
        isPaused = false;
        backupState = null;
        snackbarEl.classList.remove('show');

        syncSizeButtons();
        updateBestChip();
        updateStatsUI();
        buildBoardDOM();
        saveGameState();
        if (moves > 0) startTimer();
      });

      pauseBtn.addEventListener('click', () => setPaused(!isPaused));
      resumeBtn.addEventListener('click', () => setPaused(false));
      shuffleBtn.addEventListener('click', () => startNewGame(size, true));
      playAgainBtn.addEventListener('click', () => startNewGame(size, false));

      winModal.addEventListener('click', (e) => {
        if (e.target === winModal) {
          winModal.classList.remove('open');
        }
      });

      window.addEventListener('popstate', () => {
        if (winModal.classList.contains('open')) {
          winModal.classList.remove('open');
          return;
        }
        if (isPaused) {
          setPaused(false);
        }
      });

      sizeBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const nextSize = Number(btn.dataset.size);
          if (nextSize !== size) {
            startNewGame(nextSize, true);
          }
        });
      });

      window.addEventListener('beforeunload', saveGameState);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && moves > 0 && !isWon) {
          saveGameState();
          setPaused(true);
        }
      });

      const ro = new ResizeObserver(() => {
        if (tileElements.size > 0) {
          computeMetrics();
          applyTileSizes();
          renderTiles();
        }
      });
      ro.observe(tilesLayerEl);

      function launchConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#FFD13B', '#34D399', '#5BC0EB', '#FF9F87', '#C4B5FD'];
        const pieces = Array.from({ length: 70 }, () => ({
          x: canvas.width * (0.2 + Math.random() * 0.6),
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 12,
          vy: -6 - Math.random() * 10,
          w: 8 + Math.random() * 6,
          h: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.25
        }));

        let frames = 0;
        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rot += p.vrot;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.strokeStyle = '#1E1B18';
            ctx.lineWidth = 2;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });

          frames++;
          if (frames < 110) {
            requestAnimationFrame(tick);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }
        requestAnimationFrame(tick);
      }

      if (loadGameState()) {
        syncSizeButtons();
        updateBestChip();
        updateStatsUI();
        buildBoardDOM();
        if (moves > 0) startTimer();
      } else {
        startNewGame(4, false);
      }
      requestAnimationFrame(() => {
        computeMetrics();
        applyTileSizes();
        renderTiles();
      });
    })();
  </script>
</body>
</html>
